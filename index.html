<script>
const r = (s, n) => s.repeat(n);
const ROCK = { hh: r("x.", 8), sn: "....x.......x...", kk: "x.......x......." };

// Each task: id, title, text, goal, optional groove, img (IMAGES key), video (VIDEOS key), key (show notation key).
const LEVELS = [
  { part: "Beginner", title: "Foundations", intro: "Before any beats: know the instrument, sit well, hold the sticks and learn to count.", tasks: [
    { id: "kit", title: "Know your kit", img: "kit-labeled", video: "kit", text: "A standard kit has a kick (bass drum) played with the right foot, a snare in front of you, a hi-hat (two cymbals on a stand, opened and closed with the left foot), one or two rack toms, a floor tom, a ride cymbal for steady patterns and a crash cymbal for accents.", goal: "Point to and name every piece of a kit without looking anything up." },
    { id: "setup", title: "Set up the throne and kit", video: "setup", text: "Sit so your thighs are level or slope slightly down. The snare sits around waist height. You should reach every drum and cymbal without stretching or leaning. Comfort first: tension is the enemy of good playing.", goal: "Play for 10 minutes with no back, neck or shoulder tension." },
    { id: "grip", title: "Matched grip", img: "pad", video: "grip", text: "Pinch the stick between thumb and index finger about a third of the way up from the end. That pinch point is the fulcrum. Wrap the other fingers loosely. Let the stick bounce back off the head; don't squeeze it.", goal: "One minute of steady strokes per hand with the stick rebounding freely." },
    { id: "count", title: "Count out loud", video: "count", text: "Each beat splits into four 16th notes: \"1 e & a, 2 e & a, 3 e & a, 4 e & a\". Counting out loud is the quickest way to stay in time. Below: quarter notes on the snare, one per beat.", goal: "Count 16ths out loud while clapping quarter notes at 70 BPM for one minute.", groove: { sub: 4, bpm: 70, sn: r("x...", 4) } },
    { id: "metro", title: "Play with a metronome", img: "metronome", video: "metro", text: "The metronome is your band. A free metronome app is fine. Press Play below and try to make your hit disappear into the click.", goal: "Quarter notes at 60 BPM for two minutes, every hit exactly on the click.", groove: { sub: 4, bpm: 60, sn: r("x...", 4) } },
  ]},
  { part: "Beginner", title: "Hands and Reading", intro: "Most of drumming is your hands, and most learning material is written down. Build both here.", tasks: [
    { id: "read", title: "Read drum notation", key: true, video: "read", text: "Drum music uses a normal five-line staff, but each line or space is a drum instead of a pitch. Kick sits low, snare in the middle, cymbals on top with x-shaped noteheads. Hands are usually written with stems up, feet with stems down. Keep this key handy; every exercise on this site uses it.", goal: "Look at any groove on this site and say which drum plays on each beat." },
    { id: "values", title: "Quarter, 8th and 16th notes", video: "values", text: "Same tempo, three speeds. One bar of quarter notes (one per beat), one bar of 8th notes (two per beat, joined by one beam) and one of 16th notes (four per beat, two beams). The tempo never changes, only how many notes fit in each beat.", goal: "Switch every bar at 70 BPM without speeding up or slowing down.", groove: { sub: 4, bpm: 70, sn: r("x...", 4) + r("x.", 8) + r("x", 16) } },
    { id: "singles", title: "Single strokes", video: "singles", text: "Alternate hands: R L R L. The letters under the notes are the sticking. Both hands should sound identical: same height, same volume.", goal: "16th-note singles at 80 BPM for two minutes, even volume in both hands.", groove: { sub: 4, bpm: 70, sn: r("x", 16), stick: r("RL", 8) } },
    { id: "doubles", title: "Double strokes", video: "doubles", text: "Two strokes per hand: R R L L. Make the second stroke as loud as the first: let the stick bounce, then add a small push from the fingers.", goal: "16th-note doubles at 80 BPM, second stroke as loud as the first.", groove: { sub: 4, bpm: 60, sn: r("x", 16), stick: r("RRLL", 4) } },
    { id: "offbeats", title: "Play only the \"&\"", text: "The 8th rests mean: don't play there. Count \"1 & 2 & 3 & 4 &\" and only hit on \"&\", between the clicks.", goal: "Only the offbeats for one minute at 70 BPM with the metronome on.", groove: { sub: 4, bpm: 70, sn: r("..x.", 4) } },
  ]},
  { part: "Beginner", title: "First Groove", intro: "The rock beat is underneath most music you hear. Learn it, then twist it.", tasks: [
    { id: "rock", title: "The basic rock beat", img: "kit-photo", video: "rock", text: "Hi-hat on every 8th note, snare on 2 and 4, kick on 1 and 3. Start slow and add one limb at a time: hi-hat alone, then add the snare, then the kick.", goal: "Two minutes at 80 BPM without stopping.", groove: { sub: 4, bpm: 70, ...ROCK } },
    { id: "kick-and3", title: "Kick on the \"&\" of 3", video: "kick-vars", text: "Add a kick on the \"&\" of 3. This small change gives one of the most used grooves in pop and rock.", goal: "Two minutes at 80 BPM.", groove: { sub: 4, bpm: 70, hh: ROCK.hh, sn: ROCK.sn, kk: "x.......x.x....." } },
    { id: "kick-vars", title: "Kick variations", text: "The hands stay the same, the kick moves. Loop it until each bar feels natural.", goal: "All four bars in a row at 75 BPM.", groove: { sub: 4, bpm: 70, hh: r("x.", 32), sn: r("....x.......x...", 4), kk: "x.....x.x......." + "x.x.....x.x....." + "x.......x.x...x." + "x.x...x...x....." } },
    { id: "ride", title: "Move it to the ride", img: "ride", video: "ride", text: "Play the same beat with your right hand on the ride cymbal instead of the hi-hat. Hit it roughly halfway between the bell and the edge.", goal: "Rock beat on the ride for two minutes at 80 BPM.", groove: { sub: 4, bpm: 70, rd: ROCK.hh, sn: ROCK.sn, kk: ROCK.kk } },
    { id: "crash1", title: "Crash on 1", img: "crash", video: "crash1", text: "Mark the start of a phrase: crash and kick together on beat 1, then back to the hi-hat.", goal: "Loop the two bars at 80 BPM without hesitating at the crash.", groove: { sub: 4, bpm: 70, cr: "x" + r(".", 31), hh: ".." + r("x.", 15), sn: r(ROCK.sn, 2), kk: r(ROCK.kk, 2) } },
  ]},
  { part: "Beginner", title: "Fills and Song Form", intro: "Fills connect the parts of a song. Songs are built in phrases of 4 and 8 bars.", tasks: [
    { id: "fill1", title: "One-beat fill", video: "fill1", text: "Groove for three beats, then four 16ths on the snare on beat 4. Don't rush the fill, and land back on 1 in time.", goal: "Loop at 80 BPM with the groove after the fill exactly in time.", groove: { sub: 4, bpm: 70, hh: r("x.", 6) + "....", sn: "....x.......xxxx", kk: "x.......x.x....." } },
    { id: "fill-around", title: "Fill around the toms", video: "fill-around", text: "One bar of groove, then a bar of 16ths moving down the kit: snare, tom 1, tom 2, floor tom. Land on crash and kick.", goal: "Loop at 70 BPM, landing every crash on 1.", groove: { sub: 4, bpm: 65, cr: "x" + r(".", 31), hh: ".." + r("x.", 7) + r(".", 16), sn: ROCK.sn + "xxxx" + r(".", 12), t1: r(".", 20) + "xxxx" + r(".", 8), t2: r(".", 24) + "xxxx....", ft: r(".", 28) + "xxxx", kk: ROCK.kk + r(".", 16) } },
    { id: "phrase", title: "4-bar phrases", video: "song", text: "Three bars of groove and one bar with a fill. Most songs are built this way. Count the bars out loud: \"ONE 2 3 4, TWO 2 3 4...\"", goal: "Five phrases in a row at 80 BPM without losing count.", groove: { sub: 4, bpm: 75, cr: "x" + r(".", 63), hh: ".." + r("x.", 23) + r("x.", 6) + "....", sn: r(ROCK.sn, 3) + "....x.......xxxx", kk: r(ROCK.kk, 3) + "x.......x.x....." } },
    { id: "song", title: "Play a whole song", text: "Pick any song you like with a simple, medium tempo beat. Listen first and count how many bars the verse and chorus last. Then play along with the basic beat and a fill into each chorus.", goal: "Play through one whole song without stopping." },
  ]},

  { part: "Intermediate", title: "Rudiments", intro: "Rudiments are the vocabulary of the hands. Start with the essential few.", tasks: [
    { id: "paradiddle", title: "Single paradiddle", img: "snare", video: "paradiddle", text: "R L R R, L R L L. Accent the first note of each group (the > sign). The accent switches hands every beat.", goal: "16th-note paradiddles at 90 BPM for two minutes with clear accents.", groove: { sub: 4, bpm: 70, sn: r("Xxxx", 4), stick: r("RLRRLRLL", 2) } },
    { id: "flam", title: "Flams", video: "flam", text: "The small slashed note is a grace note: a very soft stroke from one hand just before a full stroke from the other. They should sound like one fat note, not two hits.", goal: "Alternating flams on quarter notes at 80 BPM, each one sounding like a single note.", groove: { sub: 4, bpm: 70, sn: r("f...", 4), stick: "R...L...R...L..." } },
    { id: "drag", title: "Drags", video: "drag", text: "Two soft grace notes from one hand before a main stroke from the other. Think \"diddle-PLAY\". Get the flam clean first.", goal: "Alternating drags on quarter notes at 70 BPM, grace notes quiet and even." },
    { id: "hh16", title: "16th-note hi-hat groove", img: "hihat", video: "hh16", text: "The right hand plays every 16th on the hi-hat. Keep it light and accent the downbeats a little to feel the pulse.", goal: "Two minutes at 80 BPM, hi-hat even and relaxed.", groove: { sub: 4, bpm: 60, hh: r("Xxxx", 4), sn: ROCK.sn, kk: "x.......x.x....." } },
    { id: "accents", title: "Accent patterns", video: "accents", text: "Single strokes with the accent moving: on the beat, on \"e\", on \"&\", on \"a\". Accents loud, everything else quiet.", goal: "All four bars at 80 BPM with a clear difference between loud and soft.", groove: { sub: 4, bpm: 70, sn: r("Xxxx", 4) + r("xXxx", 4) + r("xxXx", 4) + r("xxxX", 4), stick: r("RL", 32) } },
  ]},
  { part: "Intermediate", title: "Dynamics and Feel", intro: "What separates good from great: how loud or soft each note is.", tasks: [
    { id: "ghost", title: "Ghost notes", video: "ghost", text: "Notes in brackets are ghost notes: very soft snare strokes between the backbeats. The stick barely leaves the head. They should be felt more than heard.", goal: "Two minutes at 75 BPM, ghosts clearly softer than the backbeat.", groove: { sub: 4, bpm: 65, hh: r("x.", 8), sn: "....X..g.g..X..g", kk: "x.....x...x....." } },
    { id: "openhh", title: "Open hi-hat", video: "openhh", text: "The small circle above a hi-hat note means open: lift your foot slightly so the cymbals ring, then close them on the next beat. The foot timing is everything.", goal: "Open on the \"&\" of 4 and close exactly on 1, two minutes at 80 BPM.", groove: { sub: 4, bpm: 70, hh: "x.x.x.x.x.x.x.o.", sn: ROCK.sn, kk: "x.......x.x....." } },
    { id: "hhfoot", title: "Hi-hat foot", video: "hhfoot", text: "Rock beat on the ride while the left foot closes the hi-hat on 2 and 4 (the x below the staff). All four limbs at once.", goal: "Two minutes at 80 BPM, foot \"chick\" clear and in time.", groove: { sub: 4, bpm: 70, rd: ROCK.hh, sn: ROCK.sn, kk: ROCK.kk, hf: ROCK.sn } },
    { id: "volumes", title: "Same groove, three volumes", video: "volumes", text: "Play the rock beat very quietly, then medium, then loud. Keep the tempo: most drummers speed up as they get louder.", goal: "One minute at each volume at 80 BPM, tempo steady." },
  ]},
  { part: "Intermediate", title: "Triplets and Shuffle", intro: "Split each beat into three. Blues, shuffles and 12/8 live here.", tasks: [
    { id: "triplets", title: "Triplets in 12/8", video: "triplets", text: "In 12/8 each beat is a group of three 8th notes: \"1 trip let, 2 trip let\". Alternate hands, so every beat starts on a different hand.", goal: "Even triplets at 80 BPM, three identical notes per beat.", groove: { sub: 3, bpm: 70, sn: r("Xxx", 4), stick: r("RLRLRL", 2) } },
    { id: "shuffle", title: "Basic shuffle", video: "shuffle", text: "Leave out the middle note of each triplet on the hi-hat. That long-short bounce is the shuffle.", goal: "Two minutes at 90 BPM with a relaxed bounce.", groove: { sub: 3, bpm: 85, hh: r("x.x", 4), sn: "...x.....x..", kk: "x.....x....." } },
    { id: "128", title: "12/8 slow blues", video: "128", text: "All triplets on the hi-hat, snare on 2 and 4. Very slow and heavy.", goal: "Two minutes at 55 BPM without rushing.", groove: { sub: 3, bpm: 55, hh: r("Xxx", 4), sn: "...x.....x..", kk: "x.....x.x..." } },
    { id: "halftime", title: "Half-time feel", video: "halftime", text: "Same tempo, but the snare only on 3. The song suddenly feels twice as slow and heavy.", goal: "Switch between the rock beat and half-time every 4 bars at 80 BPM.", groove: { sub: 4, bpm: 80, hh: r("x.", 8), sn: "........x.......", kk: "x.....x...x....." } },
  ]},
  { part: "Intermediate", title: "Styles", intro: "Every genre has a signature groove. Learn the core pattern of each here; the Genres page goes deeper.", tasks: [
    { id: "funk", title: "Funk", video: "funk", text: "Syncopated kick, ghost notes, tight hi-hat. Keep the backbeat strong and the ghosts tiny.", goal: "Two minutes at 85 BPM, grooving, not just correct.", groove: { sub: 4, bpm: 75, hh: r("x.", 8), sn: "....X..g.g..X..g", kk: "x.x.......x..x.." } },
    { id: "disco", title: "Disco and four on the floor", video: "disco", text: "Kick on every beat and an open hi-hat on every \"&\". Dance music runs on this.", goal: "Two minutes at 115 BPM.", groove: { sub: 4, bpm: 110, hh: r("x.o.", 4), sn: ROCK.sn, kk: r("x...", 4) } },
    { id: "metal", title: "Metal gallop", video: "metal", text: "The kick plays a gallop (an 8th and two 16ths) under quarter notes on the hi-hat and a backbeat. Played on one pedal or two.", goal: "Two minutes at 110 BPM with every kick even.", groove: { sub: 4, bpm: 90, cr: "x...............", hh: "....x...x...x...", sn: ROCK.sn, kk: r("x.xx", 4) } },
    { id: "country", title: "Country train beat", video: "country", text: "16th notes on the snare with accents on 2 and 4, kick on 1 and 3. It sounds like a train rolling down the track. Often played with brushes.", goal: "Two minutes at 100 BPM, accents clear and the 16ths even.", groove: { sub: 4, bpm: 90, sn: "xxxxXxxxxxxxXxxx", stick: r("RL", 8), kk: ROCK.kk } },
    { id: "onedrop", title: "Reggae one drop", video: "onedrop", text: "Nothing on 1. Kick and cross-stick land together on 3, under a swung hi-hat.", goal: "Two minutes at 75 BPM, resisting the urge to play on 1.", groove: { sub: 3, bpm: 75, hh: r("x.x", 4), rs: "......x.....", kk: "......x....." } },
    { id: "jazz", title: "Jazz ride pattern", video: "jazz", text: "\"Ding, ding-a, ding, ding-a\" on the ride, hi-hat foot on 2 and 4, kick feathered very softly on all four beats.", goal: "Three minutes at 120 BPM, relaxed and swinging.", groove: { sub: 2, bpm: 120, swing: true, rd: "x.xxx.xx", hf: "..x...x.", kk: "g.g.g.g." } },
    { id: "bossa", title: "Bossa nova", video: "bossa", text: "Steady 8ths on the hi-hat, a soft kick pattern, and a clave rhythm on cross-stick spread over two bars.", goal: "Two minutes at 130 BPM, soft and smooth.", groove: { sub: 2, bpm: 130, hh: r("x", 16), rs: "x..x..x...x..x..", kk: r("x..xx..x", 2) } },
  ]},

  { part: "Advanced", title: "Independence", intro: "Make each limb do its own thing without the others falling apart.", tasks: [
    { id: "kickdoubles", title: "Kick doubles", video: "kickdoubles", text: "Two fast 16th-note kicks in a row while the hands stay steady.", goal: "Two minutes at 90 BPM, both kicks equal.", groove: { sub: 4, bpm: 75, hh: r("x.", 8), sn: ROCK.sn, kk: "x.......xx.x..xx" } },
    { id: "linear", title: "Linear groove", video: "linear", text: "No two limbs ever play at the same time. It creates a flowing, funky texture.", goal: "Two minutes at 80 BPM, every note clean and separate.", groove: { sub: 4, bpm: 65, hh: ".xx..x...xx...xx", sn: "....X.g.....X...", kk: "x..x....x..x...." } },
    { id: "hands-feet", title: "Paradiddles over steady feet", video: "independence", text: "Paradiddles on the snare while the kick plays quarter notes and the hi-hat foot plays 2 and 4.", goal: "Two minutes at 80 BPM, feet never drifting.", groove: { sub: 4, bpm: 70, sn: r("Xxxx", 4), stick: r("RLRRLRLL", 2), kk: r("x...", 4), hf: ROCK.sn } },
    { id: "ostinato", title: "Foot ostinato", text: "Lock the feet into a pattern (kick on 1 and the \"&\" of 2, hi-hat foot on 2 and 4), then improvise freely with the hands on top.", goal: "Improvise with the hands for two minutes at 80 BPM without the feet changing.", groove: { sub: 4, bpm: 70, kk: "x.....x.x.....x.", hf: ROCK.sn } },
  ]},
  { part: "Advanced", title: "Odd Time and Polyrhythm", intro: "Bars that aren't four beats long, and rhythms that cross each other.", tasks: [
    { id: "54", title: "5/4", video: "54", text: "Five beats per bar. Count \"1 2 3 4 5\" and feel the extra beat before the bar starts again.", goal: "Two minutes at 90 BPM, never losing where 1 is.", groove: { sub: 4, bpm: 85, bar: 20, hh: r("x.", 10), sn: "....x.......x.......", kk: "x.......x.......x.x." } },
    { id: "78", title: "7/8", video: "78", text: "Seven 8th notes per bar, grouped 2 + 2 + 3. Count \"1 2, 1 2, 1 2 3\".", goal: "Two minutes with the 8th note at 160 BPM.", groove: { sub: 1, bpm: 160, bar: 7, groups: [2, 2, 3], hh: r("x", 14), sn: r("..x..x.", 2), kk: r("x...x..", 2) } },
    { id: "32", title: "3 against 2", video: "32", text: "In 3/4, the hi-hat plays three quarter notes while the kick plays two even notes (one every three 8ths). Say \"pass the gol-den but-ter\".", goal: "Loop for one minute at 60 BPM, both rhythms even.", groove: { sub: 2, bpm: 60, bar: 6, hh: r("x.", 3), kk: "x..x.." } },
    { id: "43", title: "4 against 3", video: "43", text: "In 3/4, the kick plays three quarter notes while the snare plays four even notes (one every three 16ths).", goal: "Loop for one minute at 50 BPM, both rhythms even.", groove: { sub: 4, bpm: 50, bar: 12, sn: "x..x..x..x..", kk: "x...x...x..." } },
  ]},
  { part: "Advanced", title: "Technique and Speed", intro: "Efficient motion lets you play faster, louder and longer with less effort.", tasks: [
    { id: "moeller", title: "Moeller motion", video: "moeller", text: "One whipping motion produces a loud accent followed by soft taps. The arm leads, the wrist and stick follow.", goal: "Accented triplets in one hand at 100 BPM, relaxed.", groove: { sub: 3, bpm: 80, sn: r("Xxx", 4), stick: r("R", 12) } },
    { id: "sixstroke", title: "Six-stroke roll", video: "sixstroke", text: "R L L R R L, with accents on the first and last notes. A favourite for fast fills.", goal: "Triplets at 100 BPM with clear accents.", groove: { sub: 3, bpm: 75, sn: r("XxxxxX", 2), stick: r("RLLRRL", 2) } },
    { id: "doublebass", title: "Continuous 16ths on the kick", img: "double-pedal", video: "doublebass", text: "Either a double pedal (right, left, right, left) or heel-toe on one pedal. Start slow and keep every note even.", goal: "One minute of 16ths at 100 BPM, every note at the same volume.", groove: { sub: 4, bpm: 80, hh: r("x...", 4), sn: ROCK.sn, kk: r("x", 16) } },
    { id: "speed", title: "Build speed safely", video: "speed", text: "Pick a rudiment, play it clean at a comfortable tempo, raise the tempo by 4 BPM, repeat. If it gets messy or tense, drop back 8 BPM.", goal: "16th-note single strokes at 130 BPM for one minute, relaxed.", groove: { sub: 4, bpm: 100, sn: r("x", 16), stick: r("RL", 8) } },
  ]},
  { part: "Advanced", title: "Musicianship", intro: "The last level isn't a technique; it's playing music with other people.", tasks: [
    { id: "click", title: "Play a song to a click", video: "click", text: "Put a click track in headphones and play a full song on top of it, the way studio sessions and live shows with backing tracks work.", goal: "Play a whole song with a click and stay locked from start to finish." },
    { id: "record", title: "Record yourself", video: "record", text: "Record a practice session on your phone. Listen back the next day and write down three things to improve.", goal: "Record, review, and fix one of those three things." },
    { id: "transcribe", title: "Transcribe a groove by ear", video: "transcribe", text: "Pick a song and work out its main groove. Write it down in notation, using the key from level 2.", goal: "Transcribe three grooves and play them along with the songs." },
    { id: "solo", title: "Trade fours", video: "fours", text: "Four bars of groove, four bars of solo, back to groove, always in time. Use ideas from every level so far.", goal: "Five rounds in a row at 90 BPM without losing the form." },
    { id: "band", title: "Play with other musicians", text: "Join a jam, a band, or a friend with a guitar. Listen more than you play.", goal: "Play three songs with other people." },
    { id: "own", title: "Write your own groove", text: "Invent a groove using anything you've learned and write it down in notation.", goal: "Play your groove for two minutes and teach it to someone else." },
  ]},
];
const PARTS = { Beginner: "Part I", Intermediate: "Part II", Advanced: "Part III" };

// ---------- progress (localStorage) ----------
const KEY = "drums-roadmap";
let state = { done: [], unlocked: 0 };
try { state = { ...state, ...JSON.parse(localStorage.getItem(KEY)) }; } catch {}
const done = new Set(state.done);
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ done: [...done], unlocked: state.unlocked })); } catch {} };
const count = l => LEVELS[l].tasks.filter(t => done.has(t.id)).length;
const isUnlocked = l => l <= state.unlocked;

function refreshUnlocks() {
  while (state.unlocked < LEVELS.length - 1 && count(state.unlocked) === LEVELS[state.unlocked].tasks.length) {
    state.unlocked++;
    toast(`Lesson ${state.unlocked + 1} unlocked: ${LEVELS[state.unlocked].title}`);
  }
  save();
}

// ---------- rendering ----------
const $ = s => document.querySelector(s);
const levelFromHash = () => Math.min(Math.max(parseInt(location.hash.replace("#level-", "")) - 1 || 0, 0), LEVELS.length - 1);
let current = levelFromHash();

function renderToc() {
  let html = "", part = "";
  LEVELS.forEach((l, i) => {
    if (l.part !== part) { html += `${part ? "</ol>" : ""}<div class="toc-part sc">${PARTS[l.part]} · ${l.part}</div><ol>`; part = l.part; }
    const n = count(i), total = l.tasks.length, locked = !isUnlocked(i);
    const status = n === total ? "done" : locked ? "locked" : `${n}/${total}`;
    html += `<li><a href="#level-${i + 1}" class="${locked ? "locked" : ""} ${n === total ? "complete" : ""}" ${i === current ? 'aria-current="page"' : ""}>
      <span class="n">${i + 1}</span><span>${l.title}</span><span class="lead"></span><span class="s">${status}</span></a></li>`;
  });
  const all = LEVELS.reduce((a, l) => a + l.tasks.length, 0);
  $("#toc-body").innerHTML = `<p class="toc-head sc">Contents</p>${html}</ol><p class="toc-total">${done.size} of ${all} exercises complete</p>`;
  $("#toc-summary").textContent = `Contents · Lesson ${current + 1} of ${LEVELS.length}`;
}

function exerciseHTML(t, num, locked) {
  return `<li class="ex${done.has(t.id) ? " done" : ""}">
    <input type="checkbox" data-id="${t.id}" ${done.has(t.id) ? "checked" : ""} ${locked ? "disabled" : ""} aria-label="Mark complete: ${esc(t.title)}">
    <details><summary><span class="num">${num}</span><span class="title">${esc(t.title)}</span></summary>
      <div class="ex-body">
        <p>${esc(t.text)}</p>
        ${t.key ? `<div class="notation-key" role="img" aria-label="Drum notation key"></div>` : ""}
        ${t.groove ? grooveHTML(t.id, t.groove) : ""}
        <p class="goal"><b>Goal</b> ${esc(t.goal)}</p>
        ${t.img ? photoHTML(t.img) : ""}
        ${t.video ? videoHTML(t.video) : ""}
      </div>
    </details></li>`;
}

function renderMain() {
  stop();
  const l = LEVELS[current], n = count(current), total = l.tasks.length, locked = !isUnlocked(current);
  $("#main").innerHTML = `
    <p class="eyebrow sc">${PARTS[l.part]} · ${l.part} · Lesson ${current + 1}</p>
    <h1>${l.title}</h1>
    <p class="lede">${l.intro}</p>
    <div class="progress"><span id="progress-text">${n} of ${total} complete</span><span class="meter"><i style="width:${n / total * 100}%"></i></span>
      ${!locked && n < total ? `<button class="btn" id="knowit">I already know this lesson</button>` : ""}</div>
    ${locked ? `<div class="notice"><span>This lesson unlocks when you finish lesson ${state.unlocked + 1}. You can still read it. Already past this point?</span>
      <button class="btn" id="skip">Mark lessons 1 to ${current} as known</button></div>` : ""}
    <ol class="exercises">${l.tasks.map((t, i) => exerciseHTML(t, `${current + 1}.${i + 1}`, locked)).join("")}</ol>
    <footer>
      <p>A practice checklist, not a course, and not affiliated with any brand, school or creator. Videos are embedded from YouTube and belong to their creators. Photos come from Wikimedia Commons under the licenses shown. Notation is rendered with abcjs and played with the FluidR3 General MIDI sound set.</p>
      <p>Progress is saved in this browser only. <button class="linkish" id="reset">Reset progress</button></p>
    </footer>`;
}

function render() { renderToc(); renderMain(); }

let toastTimer;
function toast(msg) {
  const el = $("#toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}

// ---------- events ----------
addEventListener("hashchange", () => {
  current = levelFromHash(); render(); scrollTo(0, 0);
  if (!desktop.matches) $("#toc").open = false;
});

$("#main").addEventListener("change", e => {
  const id = e.target.dataset.id; if (!id) return;
  e.target.checked ? done.add(id) : done.delete(id);
  e.target.closest(".ex").classList.toggle("done", e.target.checked);
  refreshUnlocks(); renderToc();
  const total = LEVELS[current].tasks.length, n = count(current);
  $(".meter i").style.width = n / total * 100 + "%";
  $("#progress-text").textContent = `${n} of ${total} complete`;
  if (n === total) $("#knowit")?.remove();
});

$("#main").addEventListener("click", e => {
  if (e.target.closest("#knowit")) { LEVELS[current].tasks.forEach(t => done.add(t.id)); refreshUnlocks(); render(); }
  else if (e.target.closest("#skip")) {
    for (let i = 0; i < current; i++) LEVELS[i].tasks.forEach(t => done.add(t.id));
    refreshUnlocks(); render();
  }
  else if (e.target.closest("#reset") && confirm("Reset all progress?")) {
    done.clear(); state.unlocked = 0; save(); location.hash = "level-1"; render();
  }
});

const desktop = matchMedia("(min-width: 861px)");
$("#toc").open = desktop.matches;
desktop.addEventListener("change", () => { $("#toc").open = desktop.matches; });

render();
</script>
</body>
</html>
