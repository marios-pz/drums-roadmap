<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drums Roadmap</title>
<meta name="description" content="A free, step-by-step roadmap for drummers, from first beat to advanced. Every groove plays in your browser.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥁</text></svg>">
<style>
:root {
  --bg: #0f0f12; --panel: #17171c; --panel-2: #1f1f26; --line: #2a2a33;
  --text: #ececf1; --muted: #9a9aa8; --accent: #ff7a1a; --accent-soft: #ff7a1a22;
  --ok: #3ecf8e; --beginner: #3ecf8e; --intermediate: #f5c518; --advanced: #ff4d5e;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --panel-2: #f0efeb; --line: #e2e0da;
    --text: #1b1b1f; --muted: #6b6b76; --accent: #e8650a; --accent-soft: #e8650a1c;
    --ok: #12a26a; --beginner: #12a26a; --intermediate: #c99a00; --advanced: #d93445;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }

/* ---------- sidebar ---------- */
aside {
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  background: var(--panel); border-right: 1px solid var(--line); padding: 24px 16px;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 20px; letter-spacing: -.02em; margin: 0 8px 4px; }
.brand span { color: var(--accent); }
.overall { margin: 0 8px 24px; color: var(--muted); font-size: 13px; }
.tier { margin: 20px 8px 8px; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
.tier::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.levels { list-style: none; margin: 0; padding: 0; }
.lvl {
  width: 100%; display: flex; align-items: center; gap: 12px; text-align: left;
  background: none; border: 0; border-radius: 10px; padding: 8px; margin-bottom: 2px;
}
.lvl:hover { background: var(--panel-2); }
.lvl[aria-current="page"] { background: var(--accent-soft); }
.lvl.locked { color: var(--muted); }
.ring {
  --p: 0; flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
  background: conic-gradient(var(--c) calc(var(--p) * 1%), var(--line) 0);
  font-size: 13px; font-weight: 700;
}
.ring b { width: 28px; height: 28px; border-radius: 50%; background: var(--panel); display: grid; place-items: center; }
.lvl.done .ring b { background: var(--c); color: var(--panel); }
.lvl small { display: block; color: var(--muted); font-size: 12px; }
.lock { width: 14px; height: 14px; margin-left: auto; opacity: .6; flex: none; }

/* ---------- main ---------- */
main { padding: 40px clamp(16px, 5vw, 64px) 80px; max-width: 900px; width: 100%; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--c); }
h1 { font-size: clamp(28px, 4vw, 40px); line-height: 1.1; letter-spacing: -.03em; margin: 6px 0 10px; }
.intro { color: var(--muted); margin: 0 0 20px; max-width: 60ch; }
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--c); transition: width .3s; }
.meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin: 8px 0 28px; color: var(--muted); font-size: 14px; }
.btn {
  border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; font-size: 14px;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

.locked-note {
  display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap;
  border: 1px dashed var(--line); border-radius: 12px; padding: 16px; margin-bottom: 20px; background: var(--panel);
}

.tasks { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.task { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.task.is-done { border-color: color-mix(in srgb, var(--ok) 50%, var(--line)); }
.task input { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--ok); cursor: pointer; }
.task input:disabled { cursor: not-allowed; }
summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 8px; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "+"; color: var(--muted); font-weight: 400; }
details[open] summary::after { content: "–"; }
.is-done summary { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--ok); }
.body { padding-top: 10px; color: var(--muted); }
.body p { margin: 0 0 12px; }
.goal { border-left: 3px solid var(--ok); background: var(--panel-2); padding: 8px 12px; border-radius: 0 8px 8px 0; color: var(--text); margin: 12px 0; }
.goal b { color: var(--ok); }
.search { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; }
.chip { border: 1px solid var(--line); background: var(--panel-2); border-radius: 99px; padding: 3px 10px; font-size: 13px; }
.chip:hover { border-color: var(--accent); }

/* ---------- groove grid ---------- */
.groove { background: var(--panel-2); border-radius: 10px; padding: 12px; margin: 12px 0; }
.grid-wrap { overflow-x: auto; padding-bottom: 4px; }
.grid { display: grid; gap: 3px; align-items: center; width: max-content; }
.grid .lab { font-size: 11px; font-weight: 600; color: var(--muted); padding-right: 8px; position: sticky; left: 0; background: var(--panel-2); white-space: nowrap; }
.cell { width: 20px; height: 20px; border-radius: 4px; background: var(--line); display: grid; place-items: center; font-size: 10px; font-weight: 700; color: var(--panel); }
.cell.beat { margin-left: 5px; }
.cell.bar { margin-left: 14px; }
.cell.x { background: var(--text); opacity: .85; }
.cell.X { background: var(--accent); }
.cell.g { background: transparent; box-shadow: inset 0 0 0 2px var(--muted); }
.cell.o { background: transparent; box-shadow: inset 0 0 0 2px var(--accent); border-radius: 50%; }
.cell.f { background: var(--text); }
.cell.f::before { content: "f"; }
.cell.now { outline: 2px solid var(--accent); outline-offset: 1px; }
.stick { background: none; color: var(--muted); font-size: 11px; }
.controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 12px; font-size: 14px; }
.play { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; display: grid; place-items: center; }
.play svg { width: 16px; height: 16px; }
.controls label { display: flex; align-items: center; gap: 8px; }
.controls input[type=range] { accent-color: var(--accent); width: 140px; }
.bpm { font-variant-numeric: tabular-nums; min-width: 6ch; }
.legend { font-size: 12px; color: var(--muted); margin-top: 8px; }

footer { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
footer p { margin: 0 0 8px; }
.linkish { background: none; border: 0; padding: 0; text-decoration: underline; color: var(--muted); font-size: 13px; }

.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0;
  background: var(--accent); color: #fff; font-weight: 600; padding: 10px 18px; border-radius: 99px;
  transition: .3s; pointer-events: none;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- mobile ---------- */
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  aside { position: sticky; z-index: 2; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; align-items: center; gap: 12px; overflow-x: auto; }
  .brand { margin: 0; font-size: 16px; white-space: nowrap; }
  .overall, .tier, .lvl small, .lvl .name, .lock { display: none; }
  .levels { display: flex; gap: 4px; }
  .nav { display: flex; gap: 4px; }
  .lvl { padding: 4px; margin: 0; }
  main { padding-top: 24px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">🥁 Drums<span>Roadmap</span></div>
    <div class="overall" id="overall"></div>
    <nav class="nav" id="nav" aria-label="Levels"></nav>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
// ---------- curriculum ----------
// Groove rows: one char per step. "." rest, x hit, X accent, g ghost, o open hi-hat, f flam.
// sub = steps per beat (4 = 16ths, 3 = triplets, 2 = 8ths). bar = steps per bar (default sub*4).
const ROWS = { cr: "Crash", rd: "Ride", hh: "Hi-hat", sn: "Snare", rs: "Cross-stick", t1: "Tom 1", t2: "Tom 2", ft: "Floor tom", kk: "Kick", hf: "HH foot" };
const r = (s, n) => s.repeat(n);
const ROCK = { hh: r("x.", 8), sn: "....x.......x...", kk: "x.......x......." };

const LEVELS = [
  { tier: "Beginner", title: "Foundations", intro: "Before any beats: know the instrument, sit right, hold the sticks and learn to count.", tasks: [
    { id: "kit", title: "Know your kit", text: "A standard kit: kick (bass drum), snare, hi-hat (two cymbals with a foot pedal), one or two rack toms, floor tom, ride and crash cymbals.", goal: "Point to and name every piece of a kit without looking anything up.", search: ["drum kit parts explained"] },
    { id: "setup", title: "Set up the throne and kit", text: "Sit so your thighs are level or slope slightly down. Snare around waist height. You should reach every drum and cymbal without stretching or leaning.", goal: "Play for 10 minutes with no back, neck or shoulder tension.", search: ["drum set ergonomics", "drum throne height"] },
    { id: "grip", title: "Matched grip", text: "Pinch the stick between thumb and index finger about a third of the way up from the end. Wrap the other fingers loosely. Let the stick bounce back off the head; don't squeeze it.", goal: "One minute of steady strokes per hand with the stick rebounding freely.", search: ["matched grip drums fulcrum"] },
    { id: "count", title: "Count out loud", text: "Each beat splits into four 16th notes: \"1 e & a, 2 e & a, 3 e & a, 4 e & a\". Counting out loud is the fastest way to stay in time.", goal: "Count 16ths out loud while clapping quarter notes at 70 BPM for one minute.", search: ["how to count 16th notes"], groove: { sub: 4, bpm: 70, sn: r("x...", 4) } },
    { id: "metro", title: "Play with a metronome", text: "The metronome is your band. Press play, turn on the click and try to make your hit disappear into it.", goal: "Quarter notes at 60 BPM for two minutes, every hit exactly on the click.", search: ["practice with metronome drums"], groove: { sub: 4, bpm: 60, sn: r("x...", 4) } },
  ]},
  { tier: "Beginner", title: "Hands", intro: "Most of drumming is your hands. Build even, relaxed strokes on a pad or snare.", tasks: [
    { id: "singles", title: "Single strokes", text: "Alternate hands: R L R L. Both hands should sound identical, same height, same volume.", goal: "16th-note singles at 80 BPM for two minutes, even volume in both hands.", search: ["single stroke roll slow"], groove: { sub: 4, bpm: 70, sn: r("x", 16), stick: r("RL", 8) } },
    { id: "doubles", title: "Double strokes", text: "Two strokes per hand: R R L L. Make the second stroke as loud as the first; let the stick bounce, then add a small finger push.", goal: "16th-note doubles at 80 BPM, second stroke as loud as the first.", search: ["double stroke roll technique"], groove: { sub: 4, bpm: 60, sn: r("x", 16), stick: r("RRLL", 4) } },
    { id: "values", title: "Quarters, 8ths, 16ths", text: "Same tempo, three speeds: one bar of quarters, one of 8ths, one of 16ths. The tempo never changes, only how many notes fit in each beat.", goal: "Switch every bar at 70 BPM without speeding up or slowing down.", search: ["note values drums quarter eighth sixteenth"], groove: { sub: 4, bpm: 70, sn: r("x...", 4) + r("x.", 8) + r("x", 16) } },
    { id: "offbeats", title: "Play only the \"&\"", text: "Play only between the clicks, on the \"&\" of every beat. Count \"1 & 2 & ...\" and only play on \"&\".", goal: "Only the offbeats for one minute at 70 BPM with the click on.", search: ["offbeat eighth notes drums"], groove: { sub: 4, bpm: 70, sn: r("..x.", 4) } },
    { id: "read", title: "Read the grid", text: "On this site each column is one step (usually a 16th note), each row is an instrument. Filled = hit, orange = accent, outlined = ghost note (very soft), orange circle = open hi-hat. Wider gaps mark beats and bars.", goal: "Pick any groove on this site and clap the kick row while saying the snare row.", search: ["drum notation basics"] },
  ]},
  { tier: "Beginner", title: "First Groove", intro: "The rock beat is the foundation of most music you hear. Learn it, then twist it.", tasks: [
    { id: "rock", title: "The basic rock beat", text: "Hi-hat on every 8th note, snare on 2 and 4, kick on 1 and 3. Start slow: add one limb at a time.", goal: "Two minutes at 80 BPM without stopping.", search: ["basic rock beat drums beginner"], groove: { sub: 4, bpm: 70, ...ROCK } },
    { id: "kick-and3", title: "Kick on the \"&\" of 3", text: "Add a kick on the \"&\" of 3. This is one of the most-used grooves in pop and rock.", goal: "Two minutes at 80 BPM.", search: ["rock beat bass drum variations"], groove: { sub: 4, bpm: 70, hh: ROCK.hh, sn: ROCK.sn, kk: "x.......x.x....." } },
    { id: "kick-vars", title: "Kick variations", text: "Keep hands the same, move the kick. Loop each bar until it feels natural, then go to the next one.", goal: "All four bars in a row at 75 BPM.", search: ["8th note groove kick variations"], groove: { sub: 4, bpm: 70, hh: r("x.", 32), sn: r("....x.......x...", 4), kk: "x.....x.x......." + "x.x.....x.x....." + "x.......x.x...x." + "x.x...x...x....." } },
    { id: "ride", title: "Move it to the ride", text: "Play the same beat with your right hand on the ride cymbal instead of the hi-hat. Hit the ride about halfway between the bell and the edge.", goal: "Rock beat on the ride for two minutes at 80 BPM.", search: ["how to play ride cymbal"], groove: { sub: 4, bpm: 70, rd: ROCK.hh, sn: ROCK.sn, kk: ROCK.kk } },
    { id: "crash1", title: "Crash on 1", text: "Mark the start of a phrase: crash + kick together on beat 1, then go back to the hi-hat.", goal: "Play the two bars on loop at 80 BPM without hesitating at the crash.", search: ["crash cymbal on beat one"], groove: { sub: 4, bpm: 70, cr: "x" + r(".", 31), hh: ".." + r("x.", 15), sn: r(ROCK.sn, 2), kk: r(ROCK.kk, 2) } },
  ]},
  { tier: "Beginner", title: "Fills & Song Form", intro: "Fills connect sections. Songs are built in phrases of 4 and 8 bars.", tasks: [
    { id: "fill1", title: "One-beat fill", text: "Groove for three beats, then four 16ths on the snare on beat 4. Don't rush the fill.", goal: "Loop at 80 BPM, the groove after the fill stays exactly in time.", search: ["simple drum fill beginner"], groove: { sub: 4, bpm: 70, hh: r("x.", 6) + "....", sn: "....x.......xxxx", kk: "x.......x.x....." } },
    { id: "fill-around", title: "Fill around the toms", text: "One bar of groove, then a full bar of 16ths: snare, tom 1, tom 2, floor tom. Land on crash + kick.", goal: "Loop at 70 BPM landing every crash on 1.", search: ["drum fill around the toms"], groove: { sub: 4, bpm: 65, cr: "x" + r(".", 31), hh: "." + r(".", 1) + r("x.", 7) + r(".", 16), sn: ROCK.sn + "xxxx" + r(".", 12), t1: r(".", 20) + "xxxx" + r(".", 8), t2: r(".", 24) + "xxxx....", ft: r(".", 28) + "xxxx", kk: ROCK.kk + r(".", 16) } },
    { id: "phrase", title: "4-bar phrases", text: "Three bars of groove + one bar with a fill. This is how most songs are built. Count bars out loud: \"ONE 2 3 4, TWO 2 3 4...\"", goal: "Five phrases in a row at 80 BPM without losing count.", search: ["counting bars drums phrasing"], groove: { sub: 4, bpm: 75, cr: "x" + r(".", 63), hh: "." + r(".", 1) + r("x.", 23) + r("x.", 6) + "....", sn: r(ROCK.sn, 3) + "....x.......xxxx", kk: r(ROCK.kk, 3) + "x.......x.x....." } },
    { id: "song", title: "Play a whole song", text: "Pick any song you like with a simple, medium-tempo beat. Listen first and count how many bars the verse and chorus last. Then play along with the basic beat and a fill into each chorus.", goal: "Play through one whole song without stopping.", search: ["easy songs for beginner drummers", "song structure verse chorus bars"] },
  ]},

  { tier: "Intermediate", title: "Rudiments I", intro: "Rudiments are the vocabulary of the hands. Start with the essential few.", tasks: [
    { id: "paradiddle", title: "Single paradiddle", text: "R L R R  L R L L. Accent the first note of each group. The accent jumps hands every beat.", goal: "16th-note paradiddles at 90 BPM for two minutes with clear accents.", search: ["single paradiddle slow"], groove: { sub: 4, bpm: 70, sn: r("Xxxx", 4), stick: r("RLRRLRLL", 2) } },
    { id: "flam", title: "Flams", text: "A very soft grace note from one hand just before a full stroke from the other. They should sound like one fat note, not two hits.", goal: "Alternating flams on quarter notes at 80 BPM, every flam sounding like one note.", search: ["flam rudiment technique"], groove: { sub: 4, bpm: 70, sn: r("f...", 4), stick: "R...L...R...L..." } },
    { id: "drag", title: "Drags", text: "Two soft grace notes from one hand before a main stroke from the other. Think \"diddle-PLAY\". Get the flam clean first.", goal: "Alternating drags on quarter notes at 70 BPM, grace notes quiet and even.", search: ["drag ruff rudiment"] },
    { id: "hh16", title: "16th-note hi-hat groove", text: "Right hand plays every 16th on the hi-hat. Keep it light; accent the downbeats a little to feel the pulse.", goal: "Two minutes at 80 BPM, hi-hat even and relaxed.", search: ["16th note hi hat groove one hand"], groove: { sub: 4, bpm: 60, hh: r("Xxxx", 4), sn: ROCK.sn, kk: "x.......x.x....." } },
    { id: "singles-accent", title: "Accent patterns", text: "Single strokes with an accent moving around: on 1, on \"e\", on \"&\", on \"a\". Accents loud, everything else quiet.", goal: "All four bars at 80 BPM with a clear difference between loud and soft.", search: ["accent exercises snare"], groove: { sub: 4, bpm: 70, sn: r("Xxxx", 4) + r("xXxx", 4) + r("xxXx", 4) + r("xxxX", 4), stick: r("RL", 32) } },
  ]},
  { tier: "Intermediate", title: "Dynamics & Feel", intro: "What separates good from great: how loud or soft each note is.", tasks: [
    { id: "ghost", title: "Ghost notes", text: "Very soft snare notes between the backbeats. Stick barely leaves the head; they should be felt more than heard.", goal: "Two minutes at 75 BPM, ghosts clearly softer than the backbeat.", search: ["ghost notes snare groove"], groove: { sub: 4, bpm: 65, hh: r("x.", 8), sn: "....X..g.g..X..g", kk: "x.....x...x....." } },
    { id: "openhh", title: "Open hi-hat", text: "Lift your foot slightly to open the hi-hat on the \"&\" of 4, close it on 1. Timing of the foot is everything.", goal: "Open on \"&\" of 4 and close exactly on 1, two minutes at 80 BPM.", search: ["open hi hat technique"], groove: { sub: 4, bpm: 70, hh: "x.x.x.x.x.x.x.o.", sn: ROCK.sn, kk: "x.......x.x....." } },
    { id: "hhfoot", title: "Hi-hat foot", text: "Play the rock beat on the ride while your left foot closes the hi-hat on 2 and 4. Four limbs, all at once.", goal: "Two minutes at 80 BPM, foot chick clear and in time.", search: ["hi hat foot chick"], groove: { sub: 4, bpm: 70, rd: ROCK.hh, sn: ROCK.sn, kk: ROCK.kk, hf: ROCK.sn } },
    { id: "volumes", title: "Same groove, three volumes", text: "Play the rock beat very quietly, then medium, then loud. Don't change the tempo; drummers tend to speed up when they get louder.", goal: "One minute at each volume at 80 BPM, tempo steady.", search: ["playing drums quietly dynamics"] },
  ]},
  { tier: "Intermediate", title: "Triplets & Shuffle", intro: "Split each beat into three. Blues, swing and shuffles live here.", tasks: [
    { id: "triplets", title: "Triplets", text: "Three notes per beat: \"1 trip let, 2 trip let\". Alternate hands, so each beat starts on a different hand.", goal: "8th-note triplets at 80 BPM, three perfectly even notes per beat.", search: ["eighth note triplets drums"], groove: { sub: 3, bpm: 70, sn: r("Xxx", 4), stick: r("RLR LRL".replace(/ /g, ""), 2) } },
    { id: "shuffle", title: "Basic shuffle", text: "Leave out the middle note of each triplet on the hi-hat. That long-short bounce is the shuffle.", goal: "Two minutes at 90 BPM with a relaxed bounce.", search: ["basic shuffle drum beat"], groove: { sub: 3, bpm: 85, hh: r("x.x", 4), sn: "...x.....x..", kk: "x.....x....." } },
    { id: "128", title: "12/8 slow blues", text: "All triplets on the hi-hat, snare on 2 and 4. Very slow and heavy.", goal: "Two minutes at 55 BPM without rushing.", search: ["12/8 blues drum beat"], groove: { sub: 3, bpm: 55, hh: r("Xxx", 4), sn: "...x.....x..", kk: "x.....x.x..." } },
    { id: "halftime", title: "Half-time feel", text: "Same tempo, but the snare only on 3. The song suddenly feels twice as slow and heavy.", goal: "Switch between rock beat and half-time every 4 bars at 80 BPM.", search: ["half time feel drums"], groove: { sub: 4, bpm: 80, hh: r("x.", 8), sn: "........x.......", kk: "x.....x...x....." } },
  ]},
  { tier: "Intermediate", title: "Styles", intro: "Each genre has a signature groove. Learn the core pattern of each.", tasks: [
    { id: "funk", title: "Funk", text: "Syncopated kick, ghost notes, tight hi-hat. Keep the backbeat strong and the ghosts tiny.", goal: "Two minutes at 85 BPM, grooving, not just correct.", search: ["funk drum groove ghost notes"], groove: { sub: 4, bpm: 75, hh: r("x.", 8), sn: "....X..g.g..X..g", kk: "x.x.......x..x.." } },
    { id: "disco", title: "Disco / four on the floor", text: "Kick on every beat, open hi-hat on every \"&\". Dance music runs on this.", goal: "Two minutes at 115 BPM.", search: ["four on the floor disco beat"], groove: { sub: 4, bpm: 110, hh: r("x.o.", 4), sn: ROCK.sn, kk: r("x...", 4) } },
    { id: "onedrop", title: "Reggae one-drop", text: "Nothing on 1. Kick and cross-stick land together on 3. Swung hi-hat.", goal: "Two minutes at 75 BPM and resist playing on 1.", search: ["reggae one drop beat"], groove: { sub: 3, bpm: 75, hh: r("x.x", 4), rs: "......x.....", kk: "......x....." } },
    { id: "jazz", title: "Jazz ride pattern", text: "\"Ding, ding-a, ding, ding-a\" on the ride, hi-hat foot on 2 and 4, kick feathered very softly on all four beats.", goal: "Three minutes at 120 BPM, relaxed and swinging.", search: ["jazz ride pattern swing"], groove: { sub: 3, bpm: 120, rd: "x..x.xx..x.x", hf: "...x.....x..", kk: "g..g..g..g.." } },
    { id: "bossa", title: "Bossa nova", text: "Steady 8ths on the hi-hat, a soft kick pattern, and a clave rhythm on cross-stick over two bars.", goal: "Two minutes at 130 BPM (counted in 8ths), soft and smooth.", search: ["bossa nova drum groove"], groove: { sub: 2, bpm: 130, hh: r("x", 16), rs: "x..x..x...x..x..", kk: r("x..xx..x", 2) } },
  ]},

  { tier: "Advanced", title: "Independence", intro: "Make each limb do its own thing without the others falling apart.", tasks: [
    { id: "kickdoubles", title: "Kick doubles", text: "Two fast 16th-note kicks in a row while the hands stay steady.", goal: "Two minutes at 90 BPM, both kicks equal.", search: ["bass drum doubles groove"], groove: { sub: 4, bpm: 75, hh: r("x.", 8), sn: ROCK.sn, kk: "x.......xx.x..xx" } },
    { id: "linear", title: "Linear groove", text: "No two limbs ever play at the same time. Creates a flowing, funky texture.", goal: "Two minutes at 80 BPM, every note clean and separate.", search: ["linear drumming grooves"], groove: { sub: 4, bpm: 65, hh: ".xx..x...xx...xx", sn: "....X.g.....X...", kk: "x..x....x..x...." } },
    { id: "hands-feet", title: "Paradiddles over steady feet", text: "Paradiddles on the snare while the kick plays quarters and the hi-hat foot plays 2 and 4.", goal: "Two minutes at 80 BPM, feet never drift.", search: ["drum independence exercises"], groove: { sub: 4, bpm: 70, sn: r("Xxxx", 4), stick: r("RLRRLRLL", 2), kk: r("x...", 4), hf: ROCK.sn } },
    { id: "ostinato", title: "Foot ostinato", text: "Lock the feet into a pattern (kick on 1 and \"&\" of 2, hi-hat foot on 2 and 4), then improvise freely with the hands on top.", goal: "Improvise with the hands for two minutes at 80 BPM without the feet changing.", search: ["drum ostinato independence"], groove: { sub: 4, bpm: 70, kk: "x.....x.x.....x.", hf: ROCK.sn } },
  ]},
  { tier: "Advanced", title: "Odd Time & Polyrhythm", intro: "Bars that aren't four beats, and rhythms that cross each other.", tasks: [
    { id: "54", title: "5/4", text: "Five beats per bar. Count \"1 2 3 4 5\" and feel the extra beat before the bar restarts.", goal: "Two minutes at 90 BPM, never losing where 1 is.", search: ["5/4 drum beat"], groove: { sub: 4, bpm: 85, bar: 20, hh: r("x.", 10), sn: "....x.......x.......", kk: "x.......x.......x.x." } },
    { id: "78", title: "7/8", text: "Seven 8th notes per bar, grouped 2 + 2 + 3. Count \"1 2, 1 2, 1 2 3\".", goal: "Two minutes at 160 (8th-note) BPM.", search: ["7/8 drum groove 2 2 3"], groove: { sub: 1, bpm: 160, bar: 7, hh: r("x", 7), sn: "..x..x.", kk: "x...x.." } },
    { id: "32", title: "Polyrhythm 3 against 2", text: "Kick plays 2 even notes, hi-hat plays 3 even notes in the same space. Say \"pass the gol-den but-ter\".", goal: "Loop for one minute at 50 BPM, both rhythms even.", search: ["3 against 2 polyrhythm"], groove: { sub: 6, bpm: 50, bar: 6, hh: "x.x.x.", kk: "x..x.." } },
    { id: "43", title: "Polyrhythm 4 against 3", text: "Snare plays 4 even notes while the kick plays 3 in the same space.", goal: "Loop for one minute at 30 BPM, both rhythms even.", search: ["4 against 3 polyrhythm"], groove: { sub: 12, bpm: 30, bar: 12, sn: "x..x..x..x..", kk: "x...x...x..." } },
  ]},
  { tier: "Advanced", title: "Technique & Speed", intro: "Efficient motion lets you play faster, louder and longer with less effort.", tasks: [
    { id: "moeller", title: "Moeller / accent-tap motion", text: "One whipping motion makes a loud accent and the following soft taps. The arm leads, the wrist and stick follow.", goal: "Accented triplets in one hand at 100 BPM, relaxed, without tension.", search: ["moeller technique drums"], groove: { sub: 3, bpm: 80, sn: r("Xxx", 4), stick: r("R", 12) } },
    { id: "sixstroke", title: "Six-stroke roll", text: "R L L R R L, accents on the first and last notes. A favourite for fast fills.", goal: "Triplets at 100 BPM with clear accents.", search: ["six stroke roll"], groove: { sub: 3, bpm: 75, sn: r("XxxxxX", 2), stick: r("RLLRRL", 2) } },
    { id: "doublebass", title: "Continuous 16ths on the kick", text: "Either double pedal (R L R L) or heel-toe on one pedal. Start slow and keep every note even.", goal: "One minute of 16ths at 100 BPM, every note the same volume.", search: ["double bass drum 16ths", "heel toe technique"], groove: { sub: 4, bpm: 80, hh: r("x...", 4), sn: ROCK.sn, kk: r("x", 16) } },
    { id: "speed", title: "Build speed safely", text: "Pick a rudiment, play it clean at a comfortable tempo, raise 4 BPM, repeat. If it gets messy or tense, drop back 8 BPM.", goal: "16th-note single strokes at 130 BPM for one minute, relaxed.", search: ["how to build speed drums"], groove: { sub: 4, bpm: 100, sn: r("x", 16), stick: r("RL", 8) } },
  ]},
  { tier: "Advanced", title: "Musicianship", intro: "The final level isn't a technique; it's playing music with other people.", tasks: [
    { id: "click", title: "Play a song to a click", text: "Load a click track in headphones and play a full song on top of it, the way recording sessions and live shows with backing tracks work.", goal: "Play a whole song with a click and stay locked from start to finish.", search: ["playing to a click track drums"] },
    { id: "record", title: "Record yourself", text: "Record a practice session on your phone. Listen back the next day and write down three things to improve.", goal: "Record, review, and fix one of those three things.", search: ["recording drums with phone"] },
    { id: "transcribe", title: "Transcribe a groove by ear", text: "Pick a song and work out its main groove. Write it on paper as a grid like the ones on this site.", goal: "Transcribe three grooves and play them along with the songs.", search: ["how to transcribe drums by ear"] },
    { id: "solo", title: "Trade 4s", text: "Four bars of groove, four bars of solo, back to groove, always in time. Use ideas from every level so far.", goal: "Five rounds in a row at 90 BPM without losing the form.", search: ["trading fours drums"] },
    { id: "band", title: "Play with other musicians", text: "Join a jam, a band or a friend with a guitar. Listen more than you play.", goal: "Play three songs with other people.", search: ["how to find musicians to jam with"] },
    { id: "own", title: "Write your own groove", text: "Invent a groove using anything you've learned. Write it down as a grid.", goal: "Play your own groove for two minutes and teach it to someone else.", search: ["how to create drum grooves"] },
  ]},
];

const TIER_COLORS = { Beginner: "var(--beginner)", Intermediate: "var(--intermediate)", Advanced: "var(--advanced)" };

// Self-check: every groove row must have the same length.
for (const l of LEVELS) for (const t of l.tasks) if (t.groove) {
  const lens = Object.keys(t.groove).filter(k => ROWS[k] || k === "stick").map(k => t.groove[k].length);
  if (new Set(lens).size !== 1) console.error("Groove rows differ in length:", t.id, lens);
}

// ---------- progress (localStorage) ----------
const KEY = "drums-roadmap";
let state = { done: [], unlocked: 0 };
try { state = { ...state, ...JSON.parse(localStorage.getItem(KEY)) }; } catch {}
const done = new Set(state.done);
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ done: [...done], unlocked: state.unlocked })); } catch {} };
const count = l => LEVELS[l].tasks.filter(t => done.has(t.id)).length;
const isUnlocked = l => l <= state.unlocked;

function refreshUnlocks() {
  while (state.unlocked < LEVELS.length - 1 && count(state.unlocked) === LEVELS[state.unlocked].tasks.length) {
    state.unlocked++;
    toast(`Level ${state.unlocked + 1} unlocked: ${LEVELS[state.unlocked].title}`);
  }
  save();
}

// ---------- rendering ----------
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const LOCK = '<svg class="lock" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17 9V7A5 5 0 0 0 7 7v2H5v13h14V9h-2zm-8 0V7a3 3 0 0 1 6 0v2H9z"/></svg>';
let current = Math.min(Math.max(parseInt(location.hash.slice(7)) - 1 || 0, 0), LEVELS.length - 1);

function renderNav() {
  let html = "", tier = "";
  LEVELS.forEach((l, i) => {
    if (l.tier !== tier) { html += `${tier ? "</ul>" : ""}<div class="tier" style="--c:${TIER_COLORS[l.tier]}">${l.tier}</div><ul class="levels">`; tier = l.tier; }
    const n = count(i), total = l.tasks.length, locked = !isUnlocked(i);
    html += `<li><button class="lvl${locked ? " locked" : ""}${n === total ? " done" : ""}" data-l="${i}" style="--c:${TIER_COLORS[l.tier]}"
      ${i === current ? 'aria-current="page"' : ""} aria-label="Level ${i + 1}: ${l.title}, ${n} of ${total} done${locked ? ", locked" : ""}">
      <span class="ring" style="--p:${n / total * 100}"><b>${n === total ? "✓" : i + 1}</b></span>
      <span class="name">${l.title}<small>${n}/${total} tasks</small></span>${locked ? LOCK : ""}</button></li>`;
  });
  $("#nav").innerHTML = html + "</ul>";
  const all = LEVELS.reduce((a, l) => a + l.tasks.length, 0);
  $("#overall").textContent = `${done.size} of ${all} tasks done`;
}

function gridHTML(g) {
  const rows = Object.keys(ROWS).filter(k => g[k]);
  const len = g[rows[0]].length, bar = g.bar || g.sub * 4;
  const cls = i => i === 0 ? "" : i % bar === 0 ? " bar" : i % g.sub === 0 ? " beat" : "";
  let html = `<div class="grid" style="grid-template-columns:auto repeat(${len}, 20px)">`;
  for (const k of rows) {
    html += `<div class="lab">${ROWS[k]}</div>`;
    for (let i = 0; i < len; i++) { const c = g[k][i]; html += `<div class="cell${cls(i)}${c !== "." ? " " + c : ""}" data-i="${i}"></div>`; }
  }
  if (g.stick) {
    html += `<div class="lab">Sticking</div>`;
    for (let i = 0; i < len; i++) html += `<div class="cell stick${cls(i)}">${g.stick[i] === "." ? "" : g.stick[i]}</div>`;
  }
  return html + "</div>";
}

const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>';
const STOP = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h12v12H6z"/></svg>';

function taskHTML(t, locked) {
  const g = t.groove;
  return `<li class="task${done.has(t.id) ? " is-done" : ""}">
    <input type="checkbox" data-id="${t.id}" ${done.has(t.id) ? "checked" : ""} ${locked ? "disabled" : ""} aria-label="Mark done: ${esc(t.title)}">
    <details><summary>${esc(t.title)}</summary><div class="body">
      <p>${esc(t.text)}</p>
      ${g ? `<div class="groove" data-id="${t.id}">
        <div class="grid-wrap">${gridHTML(g)}</div>
        <div class="controls">
          <button class="play" aria-label="Play groove">${PLAY}</button>
          <label>Tempo <input type="range" min="30" max="${Math.max(200, g.bpm * 2)}" value="${g.bpm}"> <span class="bpm">${g.bpm} BPM</span></label>
          <label><input type="checkbox" class="click" checked> Click</label>
        </div>
        <div class="legend">■ hit · <span style="color:var(--accent)">■</span> accent · □ ghost · <span style="color:var(--accent)">○</span> open hi-hat · f flam</div>
      </div>` : ""}
      <div class="goal"><b>Done when:</b> ${esc(t.goal)}</div>
      <div class="search">Look it up: ${t.search.map(s => `<button class="chip" data-copy="${esc(s)}" title="Copy search phrase">🔍 ${esc(s)}</button>`).join("")}</div>
    </div></details></li>`;
}

function renderMain() {
  stop();
  const l = LEVELS[current], n = count(current), total = l.tasks.length, locked = !isUnlocked(current);
  $("#main").innerHTML = `<div style="--c:${TIER_COLORS[l.tier]}">
    <div class="eyebrow">${l.tier} · Level ${current + 1} of ${LEVELS.length}</div>
    <h1>${l.title}</h1>
    <p class="intro">${l.intro}</p>
    <div class="bar"><i style="width:${n / total * 100}%"></i></div>
    <div class="meta"><span>${n} of ${total} done</span>
      ${!locked && n < total ? `<button class="btn" id="knowit">I already know this level</button>` : ""}</div>
    ${locked ? `<div class="locked-note"><span>${LOCK.replace('class="lock"', 'class="lock" style="display:inline;opacity:1"')} Finish level ${state.unlocked + 1} to unlock this one. Already past this point?</span>
      <button class="btn primary" id="skip">Mark levels 1–${current} as known</button></div>` : ""}
    <ul class="tasks">${l.tasks.map(t => taskHTML(t, locked)).join("")}</ul>
    <footer>
      <p>Not a teacher, not a course: just a practice checklist. Not affiliated with any brand, school or creator. The "Look it up" phrases are neutral search terms; use whatever source you trust.</p>
      <p>Progress is saved in this browser only. <button class="linkish" id="reset">Reset progress</button></p>
    </footer></div>`;
}

function render() { renderNav(); renderMain(); }

let toastTimer;
function toast(msg) {
  const el = $("#toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2500);
}

// ---------- events ----------
$("#nav").addEventListener("click", e => {
  const b = e.target.closest(".lvl"); if (!b) return;
  location.hash = "level-" + (+b.dataset.l + 1);
});
addEventListener("hashchange", () => {
  current = Math.min(Math.max(parseInt(location.hash.slice(7)) - 1 || 0, 0), LEVELS.length - 1);
  render(); scrollTo(0, 0);
});

$("#main").addEventListener("change", e => {
  const id = e.target.dataset.id; if (!id) return;
  e.target.checked ? done.add(id) : done.delete(id);
  e.target.closest(".task").classList.toggle("is-done", e.target.checked);
  refreshUnlocks(); renderNav();
  const l = LEVELS[current], n = count(current);
  $(".bar i").style.width = n / l.tasks.length * 100 + "%";
  $(".meta span").textContent = `${n} of ${l.tasks.length} done`;
  if (n === l.tasks.length) $("#knowit")?.remove();
});

$("#main").addEventListener("click", e => {
  const t = e.target;
  if (t.closest("#knowit")) { LEVELS[current].tasks.forEach(x => done.add(x.id)); refreshUnlocks(); render(); }
  else if (t.closest("#skip")) {
    for (let i = 0; i < current; i++) LEVELS[i].tasks.forEach(x => done.add(x.id));
    refreshUnlocks(); render();
  }
  else if (t.closest("#reset")) {
    if (confirm("Reset all progress?")) { done.clear(); state.unlocked = 0; save(); location.hash = "level-1"; render(); }
  }
  else if (t.closest(".chip")) {
    const s = t.closest(".chip").dataset.copy;
    navigator.clipboard?.writeText(s).then(() => toast("Copied: " + s), () => toast(s));
  }
  else if (t.closest(".play")) {
    const box = t.closest(".groove");
    if (player && player.box === box) stop(); else start(box);
  }
});

$("#main").addEventListener("input", e => {
  if (e.target.type === "range") e.target.nextElementSibling.textContent = e.target.value + " BPM";
});

// ---------- audio: synthesized drums, no samples ----------
let ac, noise, player = null, timer;

function initAudio() {
  ac = new AudioContext();
  noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  const d = noise.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}

function env(t, vol, decay) {
  const g = ac.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + decay);
  g.connect(ac.destination);
  return g;
}
function tone(t, vol, decay, f0, f1, type = "sine") {
  const o = ac.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + decay);
  o.connect(env(t, vol, decay)); o.start(t); o.stop(t + decay);
}
function hiss(t, vol, decay, type, freq) {
  const s = ac.createBufferSource(); s.buffer = noise;
  const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq;
  s.connect(f).connect(env(t, vol, decay)); s.start(t); s.stop(t + decay);
}

const VOICES = {
  kk: (t, v) => tone(t, v, 0.35, 140, 45),
  sn: (t, v) => { hiss(t, v * 0.7, 0.18, "highpass", 1200); tone(t, v * 0.5, 0.1, 220, 160, "triangle"); },
  rs: (t, v) => { hiss(t, v * 0.6, 0.04, "bandpass", 2000); tone(t, v * 0.4, 0.03, 900, 700, "square"); },
  hh: (t, v) => hiss(t, v * 0.35, 0.05, "highpass", 7000),
  ho: (t, v) => hiss(t, v * 0.35, 0.3, "highpass", 6500),
  hf: (t, v) => hiss(t, v * 0.3, 0.04, "highpass", 5000),
  rd: (t, v) => { hiss(t, v * 0.2, 0.5, "highpass", 6000); tone(t, v * 0.08, 0.5, 3200, 3000, "square"); },
  cr: (t, v) => hiss(t, v * 0.45, 1.4, "highpass", 4000),
  t1: (t, v) => tone(t, v, 0.4, 260, 190),
  t2: (t, v) => tone(t, v, 0.45, 200, 140),
  ft: (t, v) => tone(t, v, 0.55, 140, 90),
};
const VEL = { x: 0.8, X: 1, g: 0.22, o: 0.8, f: 0.9 };

function playStep(g, i, t, withClick) {
  for (const k of Object.keys(ROWS)) {
    const c = g[k]?.[i]; if (!c || c === ".") continue;
    const voice = k === "hh" && c === "o" ? VOICES.ho : VOICES[k];
    if (c === "f") voice(t - 0.03, 0.25);
    voice(t, VEL[c] ?? 0.8);
  }
  if (withClick && i % g.sub === 0) tone(t, 0.25, 0.03, i % (g.bar || g.sub * 4) === 0 ? 1800 : 1200, 1000, "square");
}

function start(box) {
  stop();
  if (!ac) initAudio();
  ac.resume();
  const g = LEVELS.flatMap(l => l.tasks).find(t => t.id === box.dataset.id).groove;
  const len = g[Object.keys(ROWS).find(k => g[k])].length;
  player = { box, g, len, step: 0, next: ac.currentTime + 0.06, queue: [], last: null,
    bpm: box.querySelector("input[type=range]"), click: box.querySelector(".click"),
    cols: [...Array(len)].map((_, i) => box.querySelectorAll(`[data-i="${i}"]`)) };
  box.querySelector(".play").innerHTML = STOP;
  box.querySelector(".play").setAttribute("aria-label", "Stop groove");
  timer = setInterval(schedule, 25);
  schedule(); requestAnimationFrame(draw);
}

function schedule() {
  const p = player; if (!p) return;
  const dur = 60 / p.bpm.value / p.g.sub;
  while (p.next < ac.currentTime + 0.1) {
    playStep(p.g, p.step, p.next, p.click.checked);
    p.queue.push([p.step, p.next]);
    p.next += dur; p.step = (p.step + 1) % p.len;
  }
}

function draw() {
  const p = player; if (!p) return;
  while (p.queue.length && p.queue[0][1] <= ac.currentTime) {
    const [i] = p.queue.shift();
    p.last?.forEach(c => c.classList.remove("now"));
    p.last = p.cols[i]; p.last.forEach(c => c.classList.add("now"));
  }
  requestAnimationFrame(draw);
}

function stop() {
  if (!player) return;
  clearInterval(timer);
  player.last?.forEach(c => c.classList.remove("now"));
  const b = player.box.querySelector(".play");
  if (b) { b.innerHTML = PLAY; b.setAttribute("aria-label", "Play groove"); }
  player = null;
}

render();
</script>
</body>
</html>
