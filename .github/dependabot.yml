version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for all minor and patch updates instead of one per package.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # astro check doesn't support TypeScript 7 yet. Remove once it does:
      # https://github.com/withastro/roadmap/discussions/1321
      - dependency-name: typescript
        versions: [">=7"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
